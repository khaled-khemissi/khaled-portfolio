
name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build project media galleries
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import re

          root = pathlib.Path('.')
          image_exts = {'.jpg', '.jpeg', '.png', '.webp', '.gif'}
          video_exts = {'.mp4', '.webm', '.mov'}

          for page in (root / 'project').glob('*.html'):
              slug = page.stem
              folder = root / 'assets' / 'project' / slug
              media = []
              if folder.exists():
                  for item in sorted(folder.iterdir(), key=lambda path: path.name.lower()):
                      if item.suffix.lower() in image_exts:
                          media.append({'type': 'image', 'src': item.name, 'alt': f'Capture du projet {slug}'})
                      elif item.suffix.lower() in video_exts:
                          media.append({'type': 'video', 'src': item.name})

              encoded = json.dumps(media, ensure_ascii=False, separators=(',', ':'))
              encoded = encoded.replace('&', '\\u0026').replace('<', '\\u003c').replace('>', '\\u003e').replace('"', '\\u0022').replace("'", '\\u0027')
              html = page.read_text(encoding='utf-8-sig')
              html = re.sub(
                  r'(<div class="project-gallery" data-gallery)(?: data-media=(?:\'[^\']*\'|"[^"]*"))?',
                  lambda match: match.group(1) + ' data-media="' + encoded + '"',
                  html,
                  count=1,
              )
              page.write_text(html, encoding='utf-8')
          PY

      - name: Cache bust CSS and JS
        run: |
          VERSION="${GITHUB_SHA::12}"

          python3 - <<'PY'
          import os
          import re

          version = os.environ["VERSION"]

          with open("index.html", "r", encoding="utf-8") as f:
              html = f.read()

          # Add/update version on CSS files
          html = re.sub(
              r'(href=["\'][^"\']+\.css)(?:\?v=[^"\']*)?(["\'])',
              rf'\1?v={version}\2',
              html
          )

          # Add/update version on JS files
          html = re.sub(
              r'(src=["\'][^"\']+\.js)(?:\?v=[^"\']*)?(["\'])',
              rf'\1?v={version}\2',
              html
          )

          with open("index.html", "w", encoding="utf-8") as f:
              f.write(html)
          PY

        env:
          VERSION: ${{ github.sha }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
